name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      # Same script as the release build: NativeAOT publish, pack, then run 'canary --version'.
      - run: bash build/package-cli.sh linux-x64 0.0.0
